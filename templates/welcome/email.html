{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; line-height: 1.3; color: #18181b; padding-bottom: 16px;">
      {{ heading }}
    </td>
  </tr>
  <tr>
    <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #52525b; padding-bottom: 24px;">
      {{ body_text }}
    </td>
  </tr>
  <tr>
    <td align="center" style="padding-bottom: 24px;">
      <a href="{{ cta_url }}" style="display: inline-block; padding: 12px 32px; background-color: #2563eb; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 6px;">
        {{ cta_text }}
      </a>
    </td>
  </tr>
  <tr>
    <td align="center" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.5; color: #a1a1aa;">
      {{ sub_text }}
    </td>
  </tr>
</table>
{% endblock %}
